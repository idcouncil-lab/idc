
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://api.emailjs.com https://www.gstatic.com; frame-src https://*.firebaseapp.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="robots" content="noindex, nofollow">
<title>تسجيل الدخول</title>
</head>
<body>

<h2>دخول الإدارة</h2>

<input type="email" id="email" autocomplete="username" placeholder="البريد"><br><br>
<input type="password" id="password" autocomplete="current-password" placeholder="كلمة المرور"><br><br>

<button onclick="login()">دخول</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD2Y9jQF7XWmo0uegj3uWrQfTKbCAcH97o",
  authDomain: "id-council-c1b1d.firebaseapp.com",
  projectId: "id-council-c1b1d",
  storageBucket: "id-council-c1b1d.firebasestorage.app",
  messagingSenderId: "2987746191",
  appId: "1:2987746191:web:e8f267db34eb0a903b21fa"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.login = function() {
  // client-side throttle (Firebase also rate-limits server-side)
  let st = {n: 0, until: 0};
  try { st = JSON.parse(localStorage.getItem('loginThrottle') || '{"n":0,"until":0}'); } catch (_) {}
  if (Date.now() < st.until) { alert("محاولات كثيرة. حاول لاحقًا."); return; }

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  if (!email || !password) { alert("بيانات غير صحيحة"); return; }

  signInWithEmailAndPassword(auth, email, password)
    .then(() => {
      try { localStorage.removeItem('loginThrottle'); } catch (_) {}
      window.location.href = "admin.html";
    })
    .catch(() => {
      st.n = (st.n || 0) + 1;
      if (st.n >= 5) { st.until = Date.now() + 5 * 60 * 1000; st.n = 0; }
      try { localStorage.setItem('loginThrottle', JSON.stringify(st)); } catch (_) {}
      alert("بيانات غير صحيحة");
    });
};
</script>

</body>
</html>
